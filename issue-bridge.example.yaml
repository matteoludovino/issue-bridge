# Configuração do issue-bridge (GitHub -> Jira).
#
# Credenciais NUNCA ficam aqui: só o nome da variável de ambiente.
# Este arquivo pode e deve ser versionado.
#
# Chave desconhecida é ERRO, não é ignorada — um `milestoneStategy` com erro de
# digitação falha na validação em vez de virar comportamento silencioso.

version: 1

source:
  platform: github
  identifier: acme/api          # owner/repo
  tokenEnv: GITHUB_TOKEN
  includeRaw: false             # true dobra o tamanho do snapshot

  # Opcional: o GitHub não tem tipo nem prioridade, só label.
  # O que estiver aqui é mesclado sobre os padrões do adapter.
  # classification:
  #   typeByLabel:
  #     epico: epic
  #     melhoria: story
  #   priorityByLabel:
  #     urgentissimo: highest
  #   inProgressLabels: ['em andamento', 'wip']   # substitui a lista padrão
  #   defaultType: task

target:
  platform: jira
  baseUrl: https://acme.atlassian.net
  projectKey: ENG
  emailEnv: JIRA_EMAIL
  tokenEnv: JIRA_API_TOKEN
  epicIssueTypeName: Epic       # nome do tipo usado para épicos neste projeto
  # linkTypeNames:
  #   blocks: Blocks
  #   duplicates: Duplicate
  #   relates_to: Relates

mappings:
  # Todo valor à direita é validado contra o destino em `analyze`:
  # se não existir no Jira, sai finding `unmapped_value` e o apply é bloqueado.
  issueTypes:
    epic: Epic
    story: Story
    task: Task
    bug: Bug
    subtask: Sub-task

  priorities:
    highest: Highest
    high: High
    medium: Medium
    low: Low
    lowest: Lowest

  statuses:
    open: To Do
    in_progress: In Progress
    closed: Done

  milestoneStrategy: epic       # `epic` ou `version`
  defaultPriority: medium       # opcional; sem isso a issue vai sem prioridade

  # Único canal capaz de satisfazer custom field OBRIGATÓRIO do Jira.
  # Sem isso, qualquer projeto com campo obrigatório customizado bloqueia o apply
  # com `missing_required_field` (o que é o comportamento correto: falhar no
  # analyze, não no meio da escrita).
  fields:
    defaults: {}
    #   customfield_10042:
    #     value: Major
    byIssueType: {}
    #   Bug:
    #     customfield_10050: regressão

extract:
  includeClosed: true
  labelFilter: []               # vazio = todas as issues
  # maxItems: 500               # teto de itens lidos da API (issues + PRs)

execution:
  ledgerPath: .issue-bridge/ledger.json   # mapa origem -> destino (idempotência)
  retry:
    maxAttempts: 5
    baseDelayMs: 500
    maxDelayMs: 30000
