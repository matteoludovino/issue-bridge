# issue-bridge configuration (GitHub -> Jira).
#
# Credentials NEVER live here: only the name of the environment variable that
# holds them. This file is meant to be committed.
#
# An unknown key is an ERROR, not something ignored — a typo like
# `milestoneStategy` fails validation instead of quietly changing behaviour.

version: 1

source:
  platform: github
  identifier: acme/api          # owner/repo
  tokenEnv: GITHUB_TOKEN
  includeRaw: false             # true doubles the snapshot size

  # Optional. GitHub has no type or priority — only labels. Whatever you set
  # here is merged on top of the adapter's defaults.
  # classification:
  #   typeByLabel:
  #     initiative: epic
  #     improvement: story
  #   priorityByLabel:
  #     showstopper: highest
  #   inProgressLabels: ['in progress', 'wip']   # replaces the default list
  #   defaultType: task

  # Base URLs for GitHub Enterprise Server.
  # baseUrl: https://github.acme.com/api/v3
  # webBaseUrl: https://github.acme.com

target:
  platform: jira
  baseUrl: https://acme.atlassian.net
  projectKey: ENG
  emailEnv: JIRA_EMAIL
  tokenEnv: JIRA_API_TOKEN
  epicIssueTypeName: Epic       # name of the issue type used for epics here
  # linkTypeNames:
  #   blocks: Blocks
  #   duplicates: Duplicate
  #   relates_to: Relates

mappings:
  # Every value on the right is validated against the target during `analyze`:
  # if it does not exist in Jira you get an `unmapped_value` error and apply is
  # blocked.
  issueTypes:
    epic: Epic
    story: Story
    task: Task
    bug: Bug
    subtask: Sub-task

  priorities:
    highest: Highest
    high: High
    medium: Medium
    low: Low
    lowest: Lowest

  statuses:
    open: To Do
    in_progress: In Progress
    closed: Done

  milestoneStrategy: epic       # `epic` or `version`
  defaultPriority: medium       # optional; without it, issues carry no priority

  # The only channel that can satisfy a REQUIRED custom field in Jira. Without
  # it, any project with a mandatory custom field blocks apply with
  # `missing_required_field` — which is the correct behaviour: fail during
  # analyze, not halfway through writing.
  fields:
    defaults: {}
    #   customfield_10042:
    #     value: Major
    byIssueType: {}
    #   Bug:
    #     customfield_10050: regression

extract:
  includeClosed: true
  labelFilter: []               # empty = every issue
  # maxItems: 500               # cap on items read from the API (issues + PRs)

  # Hard floor on the change date, to cut off a long history. `sync` uses its own
  # watermark whenever that is more recent than this value.
  # updatedSince: 2026-01-01T00:00:00Z

execution:
  ledgerPath: .issue-bridge/ledger.json          # source -> target map (idempotency)
  syncStatePath: .issue-bridge/sync-state.json   # sync watermark

  # Independent actions written in parallel (the scheduler honours dependsOn).
  # Past roughly 8, the target's rate limit becomes the bottleneck. Use 1 to
  # debug with a deterministic order.
  concurrency: 4

  retry:
    maxAttempts: 5
    baseDelayMs: 500
    maxDelayMs: 30000
