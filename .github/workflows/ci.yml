name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound comes from package.json engines (commander 15 needs 22.12+);
        # upper bound is the current LTS.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # Includes the process-level suite, which builds and spawns the real
        # binary against a local HTTP server. No test reaches the network.
        run: npm test

      - name: Build
        run: npm run build
